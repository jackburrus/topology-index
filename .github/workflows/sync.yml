name: Sync catalogue
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync-catalogue.sh
      - name: Commit changes
        run: |
          git config user.name "topology-index-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync catalogue from topologyindex.com"
          git push
